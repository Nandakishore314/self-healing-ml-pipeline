name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: ruff check .

    - name: Format check with Ruff
      run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: PYTHONPATH=. python -m pytest tests/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare test data
      run: PYTHONPATH=. python scripts/prepare_data.py

    - name: Start FastAPI server
      run: |
        PYTHONPATH=. uvicorn src.app:app --host 127.0.0.1 --port 8000 &
        sleep 5
        curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/

    - name: Run TestSprite integration tests
      if: env.TESTSPRITE_API_KEY != ''
      run: |
        cd testsprite_tests
        for test_file in TC*.py; do
          echo "▶ Running $test_file..."
          python "$test_file" && echo "  ✅ PASSED" || echo "  ❌ FAILED"
        done

    - name: Skip TestSprite (no API key)
      if: env.TESTSPRITE_API_KEY == ''
      run: echo "⚠️  TESTSPRITE_API_KEY secret not set — skipping integration tests."
