name: CI Pipeline

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Format Audit with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run Test Suite with Pytest Coverage Verification
      env:
        GEMINI_API_KEY: "mock-key-value-for-ci"
      run: |
        python -m pytest -W ignore::FutureWarning --cov=src . --cov-report=term-missing
